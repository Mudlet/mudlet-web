<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No `maximum-scale` / `user-scalable=no`: pinch zoom is the first
         magnification affordance a low-vision user reaches for on a text-dense
         console, and blocking it fails WCAG 1.4.4. The map panel keeps its own
         pinch-to-zoom; see ui/preventPinchZoom.ts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Mudlet in your browser — a web-based MUD client with Mudlet Lua scripting, ANSI rendering, and full telnet/GMCP/MSDP support." />
    <meta name="theme-color" content="#090909" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <!-- Safari ignores SVG here, so the Apple touch icon is the raster Mudlet
         logo — the same 512px master the manifest's PNG icons are cut from. -->
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Chrome deprecated the apple- prefixed form in favour of the standard
         one, but Safari still reads only the prefixed name, so both ship. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mudlet Web" />
    <title>Mudlet Web</title>

    <!-- Blank-page guard.

         A deploy replaces every content-hashed asset and deletes the old ones,
         but GitHub Pages serves index.html with `max-age=600` and offers no way
         to change that. So for up to ten minutes a browser can hold a document
         naming assets that now 404. The entry module then never runs — which
         means no React, no error boundary, and nothing on screen at all.

         That is why this is inline, in the head, rather than a component: it is
         the only script guaranteed to run when the bundle itself is what failed.
         It also catches the other way a boot dies silently — the entry loads and
         throws — because the test is only ever "did anything render".

         Recovery is one reload under a URL the HTTP cache has never seen, which
         is the single bust that works with or without the service worker. It
         happens at most once per tab per reason, so a genuinely broken build
         shows the message instead of reloading forever. -->
    <script>
      (function () {
        var RETRY_KEY = 'mudix_boot_retry';
        var GRACE_MS = 3000;
        var settled = false;
        var observer = null;

        function session(fn, fallback) {
          try { return fn(sessionStorage); } catch (e) { return fallback; }
        }
        function rendered() {
          var root = document.getElementById('root');
          return !!root && root.childNodes.length > 0;
        }
        function bust() {
          var url = new URL(location.href);
          url.searchParams.set('reload', Date.now().toString(36));
          location.replace(url.toString());
        }

        // Booted cleanly: forget the retry, and drop the cache-busting param so
        // it neither sticks in the address bar nor rides along into the profile
        // deep links App.tsx writes with history.replaceState.
        function succeed() {
          if (settled) return;
          settled = true;
          if (observer) observer.disconnect();
          session(function (s) { s.removeItem(RETRY_KEY); });
          try {
            var url = new URL(location.href);
            if (url.searchParams.has('reload')) {
              url.searchParams.delete('reload');
              history.replaceState(history.state, '', url.toString());
            }
          } catch (e) { /* older browser; a stale param is harmless */ }
        }

        function fail(reason) {
          if (settled) return;
          settled = true;
          if (observer) observer.disconnect();
          // Keyed on the reason, so a second, different failure still earns one
          // reload — but the same one repeating cannot loop. With sessionStorage
          // unavailable we cannot tell, so assume retried and show the message
          // rather than risk looping.
          var already = session(function (s) { return s.getItem(RETRY_KEY); }, reason) === reason;
          session(function (s) { s.setItem(RETRY_KEY, reason); });
          if (already) { message(reason); return; }
          try { bust(); } catch (e) { message(reason); }
        }

        function message(reason) {
          var root = document.getElementById('root') || document.body;
          if (!root) return;
          root.innerHTML =
            '<div style="font:14px/1.5 system-ui,sans-serif;color:#ddd;background:#090909;' +
            'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;' +
            'justify-content:center;gap:16px;text-align:center;padding:24px">' +
            '<div style="font-size:18px;color:#fff">Mudlet Web could not start</div>' +
            '<div style="max-width:34em;color:#aaa">This is usually a half-updated copy left ' +
            'in the browser cache. Reloading normally clears it. Your profiles, scripts and ' +
            'maps are stored separately and are not affected.</div>' +
            '<button id="mudix-boot-retry" style="font:inherit;padding:8px 18px;color:#fff;' +
            'background:#1f6f6b;border:0;border-radius:6px;cursor:pointer">Reload</button>' +
            '<div id="mudix-boot-detail" style="font-size:12px;color:#666"></div></div>';
          // Textual, not interpolated: `reason` carries a filename off the page.
          var detail = document.getElementById('mudix-boot-detail');
          if (detail) detail.textContent = 'Details: ' + reason;
          var button = document.getElementById('mudix-boot-retry');
          if (button) {
            button.onclick = function () {
              session(function (s) { s.removeItem(RETRY_KEY); });
              bust();
            };
          }
        }

        // A script or stylesheet that failed to load. Capture phase: these fire
        // on the element and do not bubble. This is the fast, unambiguous path —
        // it names the asset that went missing.
        window.addEventListener('error', function (event) {
          var el = event.target;
          if (!el || el === window || !el.tagName) return;
          var tag = el.tagName.toLowerCase();
          if (tag !== 'script' && !(tag === 'link' && el.rel === 'stylesheet')) return;
          var src = el.src || el.href || '';
          if (src.indexOf('stats.mudlet.org') !== -1) return; // analytics is not the app
          fail('could not load ' + src.split('/').pop());
        }, true);

        // Nothing rendered by the time the page has finished loading. `load`
        // waits for every subresource, so a slow connection cannot trip this —
        // only a bundle that failed or threw can. The grace period is for
        // React's first paint after the module executes.
        window.addEventListener('load', function () {
          if (rendered()) { succeed(); return; }
          var root = document.getElementById('root');
          if (root && window.MutationObserver) {
            observer = new MutationObserver(function () { if (rendered()) succeed(); });
            observer.observe(root, { childList: true });
          }
          setTimeout(function () {
            if (rendered()) succeed();
            else fail('nothing rendered');
          }, GRACE_MS);
        });
      })();
    </script>
    <!-- Matomo.
         Nothing here reaches the library build: `build:lib` bundles src/index.ts
         and publishes dist-lib only, so it never reads this file. Branded builds
         bring their own index.html and inherit no tracking.

         The host check is for the other direction — this same file is served by
         `yarn dev`, `yarn preview`, and by anyone who forks and self-hosts the
         app build. Without it all of that lands in Mudlet's site 3, mixed in
         with real traffic and indistinguishable from it. Add a host here if the
         official deployment ever moves.

         Both URLs point at /js/ rather than the matomo.js / matomo.php from
         Matomo's copy-paste snippet. /js/ is Matomo's own bundled tracker
         endpoint: it serves the byte-identical tracker JS and accepts the same
         tracking hits (verified against stats.mudlet.org — 200 for the bundle,
         204 for a hit on site 3). -->
    <script>
      (function () {
        var h = location.hostname;
        if (h !== 'mudlet.github.io' && h !== 'mudlet.org' && !/\.mudlet\.org$/.test(h)) return;
        // Settings -> Privacy and security -> "Send anonymous usage statistics".
        // Its own localStorage key, not the mudix_v1 store: that store is read
        // and hydrated by a module, which is far too late — this script has
        // already fired the page view by then. Kept in step with
        // src/analytics.ts, which is what writes it.
        try {
          if (localStorage.getItem('mudix_analytics_opt_out') === '1') return;
        } catch (e) {
          /* storage blocked; fall through and track as before */
        }
        var _paq = (window._paq = window._paq || []);
        /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        var u = 'https://stats.mudlet.org/';
        _paq.push(['setTrackerUrl', u + 'js/']);
        _paq.push(['setSiteId', '3']);
        var d = document,
          g = d.createElement('script'),
          s = d.getElementsByTagName('script')[0];
        g.async = true;
        g.src = u + 'js/';
        s.parentNode.insertBefore(g, s);
      })();
    </script>
    <!-- End Matomo Code -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
