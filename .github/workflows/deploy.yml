name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # test, e2e and build run concurrently; deploy waits on all three.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test

  e2e:
    # Sharded by SPEC, not by Playwright's --shard. Every test in this suite is an
    # assertion over a recorded spec, so slicing the test list would leave each
    # shard still having to record the whole corpus; slicing the corpus is what
    # actually divides the work. Three ways because the browser sweep IS the job
    # (97s of a 2m11s run for 41 specs), while the fixed cost a shard cannot
    # avoid — checkout, install, browser deps, dev server — is around 40s.
    name: E2E (busted) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One shard failing should not hide what the other two found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BUSTED_SHARD: ${{ matrix.shard }}/3
      # Move the browser download out of ~/.cache so actions/cache can reach it
      # (the cache action only handles paths inside the workspace reliably).
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Key the browser cache on the resolved Playwright version — browser
      # builds are pinned per Playwright release, so a bump must miss the cache.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browser + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium
      # The cache only holds the browser binary; the apt-level libraries it links
      # against live in the runner image, so they still need installing on a hit.
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium
      # One command records this shard's specs and asserts them: globalSetup
      # sweeps them in the real app, and the test tree is built from that
      # recording (see playwright.config.ts). Nothing is committed or
      # pre-generated, so there is no manifest step and nothing that can go stale
      # between runs.
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [test, e2e, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
