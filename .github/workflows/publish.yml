# Publishes mudix to npm when a version tag (v*) is pushed.
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed. The package
# must have a Trusted Publisher configured on npmjs.com (package Settings →
# Trusted Publisher → GitHub Actions) pointing at this repo and this exact
# workflow filename (publish.yml). `id-token: write` lets npm CLI >= 11.5.1
# exchange GitHub's OIDC token for a short-lived publish token; provenance
# attestation is generated automatically, no `--provenance` flag needed.
#
# node-version is pinned to 24, not 22: every Node 22.x release bundles npm
# 10.x (never >= 11.5.1, checked against nodejs.org/dist/index.json), so
# trusted publishing needs a newer Node line. Node 24.5.0+ bundles a
# compliant npm out of the box — self-upgrading via `npm install -g
# npm@latest` was tried instead and broke (`Cannot find module 'sigstore'`,
# npm's own bundled dependency going missing mid-upgrade on the runner).
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: yarn install --frozen-lockfile
      - run: yarn test
      # prepublishOnly runs build:lib, so dist-lib is always freshly built.
      - run: npm publish --access public
